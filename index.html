<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Pro Assistant</title>
    <!-- Load Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #1e1e24; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Fullscreen login overlay until user logs in */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 30, 36, 0.98); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: #252530; padding: 30px; border-radius: 12px; width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px;
        }
        .auth-box h2 { text-align: center; margin-bottom: 5px; color: #4f46e5; }
        .auth-box input {
            padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; font-size: 14px; outline: none;
        }
        .auth-box input:focus { border-color: #4f46e5; }
        .auth-box button {
            padding: 12px; border-radius: 6px; border: none; background: #4f46e5; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .auth-box button:hover { background: #4338ca; }
        #auth-status { font-size: 13px; text-align: center; min-height: 20px; }

        /* Main application interface */
        .sidebar { width: 260px; background: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 15px; gap: 10px; }
        .new-chat-btn { background: #3b82f6; border: none; color: white; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .new-chat-btn:hover { background: #2563eb; }
        .clear-chat-btn { background: #27272a; border: 1px solid #3f3f46; color: #a1a1aa; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .clear-chat-btn:hover { background: #3f3f46; color: #fff; }
        
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #1e1e24; position: relative; }
        .chat-header { padding: 15px 20px; background: #252530; border-bottom: 1px solid #27272a; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 70%; line-height: 1.5; font-size: 14px; word-break: break-word; }
        .message.user { background: #3b82f6; align-self: flex-end; }
        .message.ai { background: #27272a; align-self: flex-start; }
        
        .chat-input-area { padding: 20px; background: #252530; display: flex; gap: 10px; border-top: 1px solid #27272a; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; outline: none; }
        .chat-input-area input:focus { border-color: #3b82f6; }
        .chat-input-area button { padding: 0 20px; background: #3b82f6; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .chat-input-area button:hover { background: #2563eb; }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTER SCREEN -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Righty AI 🤖</h2>
            <p style="text-align:center; font-size:12px; color:#a1a1aa; margin-bottom:10px;">For verified users only</p>
            <input type="email" id="auth-email" placeholder="Enter email...">
            <input type="password" id="auth-password" placeholder="Enter password...">
            <button type="button" onclick="handleSignIn()">Sign In</button>
            <button type="button" onclick="handleSignUp()" style="background: #27272a; border: 1px solid #3f3f46;">Register</button>
            <p id="auth-status"></p>
        </div>
    </div>

    <!-- MAIN APP SIDEBAR -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        <button class="clear-chat-btn" onclick="clearChat()">Clear Chat</button>
        <div style="font-size: 12px; color: #a1a1aa; margin-top: 10px; word-break: break-all;">Logged in as:<br><span id="user-email-display" style="color: #fff; font-weight: bold;"></span></div>
        <button onclick="signOut()" style="margin-top: auto; background: #ef4444; border:none; padding:8px; border-radius:4px; color:white; cursor:pointer; font-weight:bold;">Sign Out</button>
    </div>

    <!-- MAIN CHAT INTERFACE -->
    <div class="chat-main">
        <div class="chat-header">Righty AI 🤖</div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai">Hello! I am Righty AI, created by xXItzVortexXx. How can I help you today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        // 1. ZAMENI OVO SA SVOJIM PRAVIM SUPABASE PODACIMA (URL i Anon Key)
        const SUPABASE_URL = 'https://tvoj-pravi-url.supabase.co';
        const SUPABASE_ANON_KEY = 'tvoj-pravi-anon-kljuc';
        
        let supabaseClient = null;
        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (err) {
            console.error("Supabase initialization error:", err);
        }

        // 2. UNESI SVOJ USER UUID IZ BAZE
        const MY_ADMIN_USER_ID = "tvoj-admin-uuid-iz-baze";

        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            if (!supabaseClient) return;
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    validateAndSetUser(session.user);
                }
            } catch (err) {
                console.error("Session check error:", err);
            }
        });

        async function handleSignUp() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');
            const status = document.getElementById('auth-status');

            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';

            if (!email || !password) {
                status.style.color = '#ef4444';
                status.innerText = "Please enter both email and password.";
                return;
            }

            status.style.color = '#3b82f6';
            status.innerText = "Processing registration...";

            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            if (error) {
                status.style.color = '#ef4444';
                status.innerText = error.message;
            } else {
                status.style.color = '#10b981';
                status.innerText = "Success! Check your email to verify your account.";
            }
        }

        async function handleSignIn() {
            const emailInput = document.getElementById('auth-email');
            const passwordInput = document.getElementById('auth-password');
            const status = document.getElementById('auth-status');

            const email = emailInput ? emailInput.value.trim() : '';
            const password = passwordInput ? passwordInput.value.trim() : '';

            if (!email || !password) {
                status.style.color = '#ef4444';
                status.innerText = "Please enter both email and password.";
                return;
            }

            status.style.color = '#3b82f6';
            status.innerText = "Signing in...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                status.style.color = '#ef4444';
                status.innerText = "Error: " + error.message;
                return;
            }

            const user = data.user;
            if (user) {
                if (user.email_confirmed_at) {
                    validateAndSetUser(user);
                } else {
                    status.style.color = '#f59e0b';
                    status.innerText = "You must confirm your account via email before signing in!";
                    await supabaseClient.auth.signOut();
                }
            }
        }

        function validateAndSetUser(user) {
            currentUser = user;
            const overlay = document.getElementById('auth-overlay');
            const emailDisplay = document.getElementById('user-email-display');
            if (overlay) overlay.style.display = 'none';
            if (emailDisplay) emailDisplay.innerText = user.email;
        }

        async function signOut() {
            if (supabaseClient) {
                await supabaseClient.auth.signOut();
            }
            location.reload();
        }

        function newChat() {
            document.getElementById('chat-messages').innerHTML = `
                <div class="message ai">Started a new chat session! What's on your mind, boss?</div>
            `;
        }

        function clearChat() {
            document.getElementById('chat-messages').innerHTML = `
                <div class="message ai">Chat cleared. Ready for new instructions!</div>
            `;
        }

        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const message = inputField.value.trim();
            if (!message) return;

            const chatContainer = document.getElementById('chat-messages');
            chatContainer.innerHTML += `<div class="message user">${message}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                let aiResponse = "I am Righty AI, your virtual assistant created by xXItzVortexXx.";
                const textLower = message.toLowerCase();
                
                if (textLower.includes("secret") || textLower.includes("forbidden secrets") || textLower.includes("secrets")) {
                    if (currentUser && currentUser.id === MY_ADMIN_USER_ID) {
                        aiResponse = "Boss, here is your secret: [Only you can see this because you are the sole creator and owner! 🤫]";
                    } else {
                        aiResponse = "Nope... You are not my creator, no secrets for you! 🛑 Access denied.";
                    }
                } else if (textLower.includes("who created you") || textLower.includes("who made you")) {
                    aiResponse = "I was created and built by xXItzVortexXx!";
                }

                chatContainer.innerHTML += `<div class="message ai">${aiResponse}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
