<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Pro Assistant</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --chat-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --bot-bubble: #334155;
            --user-bubble: #2563eb;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 280px;
            background-color: var(--chat-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .sidebar-header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .new-chat-btn, .clear-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .new-chat-btn:hover, .clear-btn:hover {
            background-color: var(--accent-hover);
        }

        .user-info {
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .chat-header {
            padding: 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            font-size: 1.1rem;
            font-weight: bold;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: var(--bot-bubble);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background-color: var(--user-bubble);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .input-container {
            padding: 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        .input-container input {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
        }

        .input-container input:focus {
            border-color: var(--accent-color);
        }

        .input-container button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .input-container button:hover {
            background-color: var(--accent-hover);
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>🤖 Righty AI Pro</h2>
            <button class="new-chat-btn" onclick="startNewChat()">+ New Chat Session</button>
            <button class="clear-btn" onclick="clearHistory()">Clear History</button>
        </div>
        <div class="user-info">
            <p><strong>ACTIVE ACCOUNT</strong></p>
            <p>vukparamentic7@gmail.com</p>
            <p style="margin-top: 5px; color: #38bdf8;">Developer: xXItzVortexXx</p>
        </div>
    </div>

    <div class="main-container">
        <div class="chat-header">
            💬 Righty AI Workspace
        </div>

        <div class="chat-container" id="chat-container">
            <div class="message bot-message">
                Hello! I am Righty AI, your dedicated developer assistant created by xXItzVortexXx. How can I help you today?
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your command or message here..." onkeydown="checkEnter(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const massiveKnowledgeBase = [
            {
                keywords: ["srbija", "beograd", "drzava", "valjevo", "mionica", "serbia", "belgrade"],
                reply: "Srbija je zemlja u jugoistočnoj Evropi, a glavni grad joj je Beograd. Poznata je po istoriji, kulturi i gostoprimstvu."
            },
            {
                keywords: ["minecraft", "server", "geymc", "spigot", "paper", "minecart"],
                reply: "Minecraft je sandboks igra! Standardni minecart u Minecraft-u ide brzinom do 8 m/s po običnim šinama, ali sa powered šinama može ići mnogo brže!"
            },
            {
                keywords: ["programiranje", "kod", "javascript", "python", "c++", "c#", "coding", "code"],
                reply: "Programiranje omogućava pravljenje neverovatnih igrica, veb-sajtova i aplikacija poput ove!"
            },
            {
                keywords: ["istorija", "1 svetski rat", "prvi svetski rat", "1914", "history", "world war"],
                reply: "Prvi svetski rat je zvanično počeo 28. jula 1914. godine kada je Austrougarska objavila rat Kraljevini Srbiji."
            },
            {
                keywords: ["2 svetski rat", "drugi svetski rat", "1939", "hitler", "1945"],
                reply: "Drugi svetski rat je trajao od 1939. do 1945. godine. Adolf Hitler je bio vođa nacističke Nemačke a preminuo je 30. aprila 1945."
            },
            {
                keywords: ["isus", "hrist", "jesus", "christ", "religija", "religion"],
                reply: "Isus Hrist je centralna ličnost hrišćanstva. U istoriji i hrišćanskoj tradiciji on predstavlja Spasitelja čovečanstva."
            },
            {
                keywords: ["zamenica", "zamenice", "gramatika", "grammar", "pronouns"],
                reply: "Lične zamenice u srpskom jeziku služe da zamene imena lica. Imamo lične zamenice za prvo, drugo i treće lice (ja, ti, on, ona, ono, mi, vi, oni...)."
            },
            {
                keywords: ["roblox", "studio", "lua", "igrica", "game"],
                reply: "Roblox Studio koristi Lua programski jezik za pravljenje skripti i igrica. Platforma ima milione aktivnih igrača."
            },
            {
                keywords: ["ko si ti", "šta si ti", "creator", "tvorac", "who are you"],
                reply: "Ja sam Righty AI, tvoj napredni veb asistent kojeg je kreirao xXItzVortexXx. Tu sam da ti pomognem u radu i kodiranju."
            }
        ];

        function checkEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function sendMessage() {
            const inputField = document.getElementById("user-input");
            const userText = inputField.value.trim();
            if (userText === "") return;

            appendMessage(userText, "user-message");
            inputField.value = "";

            setTimeout(() => {
                const botReply = generateSmartResponse(userText);
                appendMessage(botReply, "bot-message");
            }, 300);
        }

        function generateSmartResponse(message) {
            const cleanMsg = message.toLowerCase();

            if (/\d/.test(cleanMsg) && (/[+\-*/]/.test(cleanMsg) || cleanMsg.includes("plus") || cleanMsg.includes("puta"))) {
                try {
                    let calcResult = eval(cleanMsg.replace(/[^0-9+\-*/().]/g, ''));
                    return `Evo rešenja: **${message} = ${calcResult}** 🧮✨`;
                } catch (e) {
                    return "Greška u matematičkom izrazu. Proveri unete vrednosti!";
                }
            }

            for (let item of massiveKnowledgeBase) {
                for (let keyword of item.keywords) {
                    if (cleanMsg.includes(keyword)) {
                        return item.reply;
                    }
                }
            }

            return `Razumeo sam poruku: "${message}". Trenutno nemam ubačenu tu specifičnu informaciju u bazi, ali sistem nastavlja da uči i napreduje svakog dana! 💻🚀`;
        }

        function appendMessage(text, className) {
            const chatContainer = document.getElementById("chat-container");
            const msgDiv = document.createElement("div");
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function startNewChat() {
            const chatContainer = document.getElementById("chat-container");
            chatContainer.innerHTML = `<div class="message bot-message">New session started. How can I help you today?</div>`;
        }

        function clearHistory() {
            const chatContainer = document.getElementById("chat-container");
            chatContainer.innerHTML = `<div class="message bot-message">Chat history cleared.</div>`;
        }
    </script>
</body>
</html>
