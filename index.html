<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Your Smart Assistant</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; animation: fadeInBody 0.6s ease-out; }
        
        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        header { background-color: #1e293b; padding: 20px; text-align: center; font-size: 1.5rem; font-weight: bold; border-bottom: 1px solid #334155; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; max-width: 800px; width: 100%; margin: 0 auto; }
        
        .message { 
            padding: 14px 18px; 
            border-radius: 12px; 
            max-width: 80%; 
            line-height: 1.6; 
            word-wrap: break-word; 
            white-space: pre-wrap;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message { background-color: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai-message { background-color: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        #input-container { background-color: #1e293b; padding: 20px; display: flex; justify-content: center; border-top: 1px solid #334155; }
        #input-box { max-width: 800px; width: 100%; display: flex; gap: 10px; }
        textarea { flex: 1; background-color: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 8px; padding: 12px; resize: none; height: 50px; outline: none; }
        button { background-color: #3b82f6; color: white; border: none; border-radius: 8px; padding: 0 20px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #2563eb; }
    </style>
</head>
<body>
    <header>Righty AI 🤖</header>
    <div id="chat-container">
        <!-- Početni pozdrav uvek na engleskom -->
        <div class="message ai-message">Hello! I am Righty AI. Ask me anything!</div>
    </div>
    <div id="input-container">
        <div id="input-box">
            <textarea id="user-input" placeholder="Type your message here..."></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>
    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';
            const loadingMsg = appendMessage("Righty AI is thinking...", 'ai-message');

            try {
                // Govorimo AI-ju da prepozna jezik i odgovori na istom jeziku
                const fullQuery = `Detect the language of this message and reply in that same language: "${text}"`;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(fullQuery)}`);
                let data = await response.text();
                
                if (!data || data.trim() === "{}" || data.trim() === "") {
                    loadingMsg.textContent = "I am ready to help you! What would you like to know?";
                } else {
                    loadingMsg.textContent = data;
                }
            } catch (error) {
                loadingMsg.textContent = "Network error: " + error.message;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
