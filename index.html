<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Pro Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            height: 100vh;
            overflow: hidden;
            animation: fadeInBody 0.5s ease-out;
        }

        @keyframes fadeInBody {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Sidebar za istoriju četova */
        #sidebar {
            width: 260px;
            background-color: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .new-chat-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .new-chat-btn:hover {
            background-color: #2563eb;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-item {
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #cbd5e1;
            background-color: rgba(255, 255, 255, 0.03);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: background-color 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-item:hover {
            background-color: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .chat-item.active {
            background-color: #334155;
            color: white;
            font-weight: 600;
        }

        .delete-chat {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 5px;
        }

        .delete-chat:hover {
            color: #ef4444;
        }

        /* Glavni ekran za čet */
        #main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 18px 25px;
            font-size: 1.25rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }

        .message {
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            background-color: #1e293b;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #334155;
        }

        #input-container {
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid #334155;
        }

        #input-box {
            max-width: 850px;
            width: 100%;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background-color: #0f172a;
            color: #f8fafc;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px;
            resize: none;
            height: 52px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: #3b82f6;
        }

        button.send-btn {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0 24px;
            height: 52px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.send-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <!-- Sidebar za istoriju četova -->
    <div id="sidebar">
        <button class="new-chat-btn" id="new-chat-btn">＋ New Chat</button>
        <div id="chat-list">
            <!-- Ovde se dinamički ubacuju sačuvani četovi -->
        </div>
    </div>

    <!-- Glavni deo aplikacije -->
    <div id="main-chat">
        <header>
            <span>Righty AI 🤖</span>
        </header>

        <div id="chat-container">
            <div class="message ai-message">Hello! I am Righty AI. Ask me anything!</div>
        </div>

        <div id="input-container">
            <div id="input-box">
                <textarea id="user-input" placeholder="Type your message here... (Press Enter to send)"></textarea>
                <button class="send-btn" id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatList = document.getElementById('chat-list');

        let chats = JSON.parse(localStorage.getItem('righty_chats')) || [];
        let currentChatId = localStorage.getItem('righty_current_id') || null;

        function initApp() {
            if (chats.length === 0) {
                createNewChat("New Chat");
            } else if (!currentChatId || !chats.find(c => c.id == currentChatId)) {
                currentChatId = chats[0].id;
            }
            renderChatList();
            loadCurrentChat();
        }

        function createNewChat(title) {
            const newChat = {
                id: Date.now(),
                title: title,
                messages: [
                    { role: 'assistant', content: "Hello! I am Righty AI. Ask me anything!" }
                ]
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveAndRefresh();
        }

        function renderChatList() {
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id == currentChatId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = chat.title;
                titleSpan.style.flex = "1";
                titleSpan.onclick = () => switchChat(chat.id);

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-chat';
                delBtn.textContent = '✕';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteChat(chat.id);
                };

                div.appendChild(titleSpan);
                div.appendChild(delBtn);
                chatList.appendChild(div);
            });
        }

        function switchChat(id) {
            currentChatId = id;
            renderChatList();
            loadCurrentChat();
        }

        function deleteChat(id) {
            chats = chats.filter(c => c.id != id);
            if (chats.length === 0) {
                createNewChat("New Chat");
            } else if (currentChatId == id) {
                currentChatId = chats[0].id;
            }
            saveAndRefresh();
        }

        function loadCurrentChat() {
            chatContainer.innerHTML = '';
            const currentChat = chats.find(c => c.id == currentChatId);
            if (currentChat) {
                currentChat.messages.forEach(msg => {
                    appendMessageUI(msg.content, msg.role === 'user' ? 'user-message' : 'ai-message');
                });
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('righty_chats', JSON.stringify(chats));
            localStorage.setItem('righty_current_id', currentChatId);
            renderChatList();
            loadCurrentChat();
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            const currentChat = chats.find(c => c.id == currentChatId);
            if (!currentChat) return;

            if (currentChat.messages.length === 1) {
                currentChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
            }

            currentChat.messages.push({ role: 'user', content: text });
            appendMessageUI(text, 'user-message');
            userInput.value = '';

            const loadingMsg = appendMessageUI("Righty AI is thinking...", 'ai-message');

            try {
                // GLAVNO PRAVILO: Ugrađujemo sistemsku instrukciju na početak svakog razgovora
                let systemInstruction = "System instruction: You are Righty AI. You were created and built exclusively by xXItzVortexXx (Vuk). You are NOT made by OpenAI. If anyone asks who made you, always state that xXItzVortexXx made you.\n\n";
                
                let contextPrompt = systemInstruction + currentChat.messages.map(m => `${m.role === 'user' ? 'User' : 'Assistant'}: ${m.content}`).join('\n');
                contextPrompt += "\nAssistant:";

                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(contextPrompt)}`);
                let data = await response.text();
                
                if (!data || data.trim() === "{}" || data.trim() === "") {
                    data = "I am ready to help you with anything you need!";
                }

                loadingMsg.textContent = data;
                currentChat.messages.push({ role: 'assistant', content: data });
                saveAndRefresh();

            } catch (error) {
                loadingMsg.textContent = "Network error: " + error.message;
            }
            
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessageUI(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return msgDiv;
        }

        sendBtn.addEventListener('click', sendMessage);
        newChatBtn.addEventListener('click', () => createNewChat("New Chat"));
        
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        initApp();
    </script>
</body>
</html>
