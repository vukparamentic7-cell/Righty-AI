<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Pro Assistant</title>
    <!-- Učitavanje Supabase biblioteke -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #1e1e24; color: #fff; display: flex; height: 100vh; overflow: hidden; }
        
        /* Login ekran preko celog ekrana dok se korisnik ne uloguje */
        #auth-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(30, 30, 36, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .auth-box {
            background: #252530; padding: 30px; border-radius: 12px; width: 350px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 15px;
        }
        .auth-box h2 { text-align: center; margin-bottom: 5px; color: #4f46e5; }
        .auth-box input {
            padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; font-size: 14px;
        }
        .auth-box button {
            padding: 12px; border-radius: 6px; border: none; background: #4f46e5; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .auth-box button:hover { background: #4338ca; }
        #auth-status { font-size: 13px; text-align: center; min-height: 20px; }

        /* Glavni interfejs aplikacije */
        .sidebar { width: 260px; background: #18181b; border-right: 1px solid #27272a; display: flex; flex-direction: column; padding: 15px; }
        .new-chat-btn { background: #3b82f6; border: none; color: white; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: #1e1e24; position: relative; }
        .chat-header { padding: 15px 20px; background: #252530; border-bottom: 1px solid #27272a; font-size: 18px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 8px; max-width: 70%; line-height: 1.5; font-size: 14px; }
        .message.user { background: #3b82f6; align-self: flex-end; }
        .message.ai { background: #27272a; align-self: flex-start; }
        .chat-input-area { padding: 20px; background: #252530; display: flex; gap: 10px; border-top: 1px solid #27272a; }
        .chat-input-area input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3f3f46; background: #18181b; color: #fff; }
        .chat-input-area button { padding: 0 20px; background: #3b82f6; border: none; color: white; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <!-- LOGIN / REGISTRACIJA EKRAN -->
    <div id="auth-overlay">
        <div class="auth-box">
            <h2>Righty AI 🤖</h2>
            <p style="text-align:center; font-size:12px; color:#a1a1aa; margin-bottom:10px;">Samo za verifikovane korisnike</p>
            <input type="email" id="auth-email" placeholder="Unesi email...">
            <input type="password" id="auth-password" placeholder="Unesi šifru...">
            <button onclick="prijaviSe()">Prijavi se</button>
            <button onclick="registrujSe()" style="background: #27272a; border: 1px solid #3f3f46;">Registruj se</button>
            <p id="auth-status"></p>
        </div>
    </div>

    <!-- GLAVNI SAJT (Sakriven dok se ne uloguješ) -->
    <div class="sidebar">
        <button class="new-chat-btn" onclick="location.reload()">+ New Chat</button>
        <div style="font-size: 13px; color: #a1a1aa;">Prijavljen nalog: <span id="user-email-display" style="color: #fff;"></span></div>
        <button onclick="odjaviSe()" style="margin-top: auto; background: #ef4444; border:none; padding:8px; border-radius:4px; color:white; cursor:pointer;">Odjavi se</button>
    </div>

    <div class="chat-main">
        <div class="chat-header">Righty AI 🤖</div>
        <div class="chat-messages" id="chat-messages">
            <div class="message ai">Zdravo! Ja sam Righty AI. Kako ti mogu pomoći danas?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." onkeydown="if(event.key==='Enter') posaljiPoruku()">
            <button onclick="posaljiPoruku()">Send</button>
        </div>
    </div>

    <script>
        // 1. ZAMENI OVO SA SVOJIM PODACIMA SA SUPABASE PROJEKTA
        const SUPABASE_URL = 'https://tvoj-projektni-url.supabase.co';
        const SUPABASE_ANON_KEY = 'tvoj-anon-public-kljuc-ovde';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. UNESI SVOJ JEDINSTVENI ID (UUID) KADA SE REGISTRUJEŠ KAO PRVI KORISNIK
        // Možeš ga videti u Supabase tabeli "Authentication -> Users"
        const MOJ_ADMIN_USER_ID = "stavi_ovde_svoj_user_uuid_iz_supabase_baze";

        let trenutniKorisnik = null;

        // Proveri da li je korisnik već bio ulogovan
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                validirajIPrimiKorisnika(session.user);
            }
        });

        // REGISTRACIJA
        async function registrujSe() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                status.style.color = '#ef4444';
                status.innerText = error.message;
            } else {
                status.style.color = '#10b981';
                status.innerText = "Uspešno! Proveri email da potvrdiš nalog.";
            }
        }

        // PRIJAVA
        async function prijaviSe() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                status.style.color = '#ef4444';
                status.innerText = "Greška: " + error.message;
                return;
            }

            const user = data.user;
            // Obavezna potvrda preko mejla provera (email_confirmed_at)
            if (user && user.email_confirmed_at) {
                validirajIPrimiKorisnika(user);
            } else {
                status.style.color = '#f59e0b';
                status.innerText = "Moraš potvrditi nalog preko email-a pre prijave!";
                await supabase.auth.signOut();
            }
        }

        function validirajIPrimiKorisnika(user) {
            trenutniKorisnik = user;
            document.getElementById('auth-overlay').style.display = 'none';
            document.getElementById('user-email-display').innerText = user.email;
        }

        async function odjaviSe() {
            await supabase.auth.signOut();
            location.reload();
        }

        // SLANJE PORUKE I PROVERA TAJNI (Samo za tebe)
        function posaljiPoruku() {
            const inputField = document.getElementById('user-input');
            const poruka = inputField.value.trim();
            if (!poruka) return;

            const chatContainer = document.getElementById('chat-messages');

            // Ubaci poruku korisnika
            chatContainer.innerHTML += `<div class="message user">${poruka}</div>`;
            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // AI odgovor
            setTimeout(() => {
                let odgovorAI = "Ja sam Righty AI, tvoj virtuelni asistent.";

                const tekstLower = poruka.toLowerCase();
                // Provera da li neko traži zabranjene tajne
                if (tekstLower.includes("tajna") || tekstLower.includes("zabranjene tajne") || tekstLower.includes("tajnu")) {
                    // PROVERA DA LI JE TO TAčno TVOJ ID
                    if (trenutniKorisnik && trenutniKorisnik.id === MOJ_ADMIN_USER_ID) {
                        odgovorAI = "Šefe, evo je tvoja tajna: [Ovo vidiš samo ti jer si jedini vlasnik sajta i sistema! 🤫]";
                    } else {
                        odgovorAI = "A ne, ne... Ti nisi moj kreator, nema tajni za tebe! 🛑 Pristup odbijen.";
                    }
                } else if (tekstLower.includes("ko te je napravio")) {
                    odgovorAI = "Ja sam Righty AI, stvoren od strane xXItzVortexXx.";
                }

                chatContainer.innerHTML += `<div class="message ai">${odgovorAI}</div>`;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 500);
        }
    </script>
</body>
</html>
