<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Righty AI - Your Smart Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 20px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-bottom: 1px solid #334155;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 18px;
            border-radius: 12px;
            max-width: 75%;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        #input-container {
            background-color: #1e293b;
            padding: 20px;
            display: flex;
            justify-content: center;
            border-top: 1px solid #334155;
        }
        #input-box {
            max-width: 800px;
            width: 100%;
            display: flex;
            gap: 10px;
        }
        textarea {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px;
            color: white;
            resize: none;
            height: 50px;
            outline: none;
        }
        textarea:focus {
            border-color: #3b82f6;
        }
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <header>Righty AI 🤖</header>

    <div id="chat-container">
        <div class="message ai-message">Hello! I am Righty AI, your smart assistant. Type in any language you want, and I will automatically reply in that same language!</div>
    </div>

    <div id="input-container">
        <div id="input-box">
            <textarea id="user-input" placeholder="Type your message here..." rows="1"></textarea>
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            // Pametna detekcija jezika i automatsko prilagođavanje odgovora
            setTimeout(() => {
                let aiResponse = "";
                
                // Proveravamo da li je korisnik pisao na srpskom / bosanskom / hrvatskom
                const lowerText = text.toLowerCase();
                const isSerbian = /š|đ|č|ć|ž|zdravo|kako|šta|bre|molim|pomoć/i.test(text);

                if (isSerbian) {
                    aiResponse = `Razumeo sam te! Kucao si na srpskom jeziku ("${text}"). Kao Righty AI, mogu tečno razgovarati i pomagati ti na srpskom, engleskom ili bilo kom drugom jeziku koji izabereš!`;
                } else {
                    aiResponse = `I understood your message: "${text}". I am fully capable of understanding, thinking, and replying in any language you use!`;
                }

                appendMessage(aiResponse, 'ai-message');
            }, 600);
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
